<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    
    <title>culculator</title>
</head>
<body>
    <div class="calculator">
        <input type="text" placeholder="0" id="inputbox">
    <div>
        <button  class="operator">AC</button>
         <button  class="operator">DEL</button>
          <button  class="operator">%</button>
           <button class="operator">/</button>
    </div>

     <div>
        <button>7</button>
         <button>8</button>
          <button>9</button>
           <button  class="operator">*</button>
    </div>

     <div>
        <button>4</button>
         <button>5</button>
          <button>6</button>
           <button class="operator">-</button>
    </div>

     <div>
        <button>1</button>
         <button>2</button>
          <button>3</button>
           <button class="operator">+</button>
    </div>

     <div>
        <button>00</button>
         <button>0</button>
          <button class="operator">.</button>
           <button class="equalBtn">=</button>
    </div>
    </div>
<script>
let input = document.getElementById("inputbox");
let buttons = document.querySelectorAll("button");

let string = "";

buttons.forEach(button => {
    button.addEventListener("click", (e) => {
        let value = e.target.innerHTML;

        if (value === "=") {
            try {
                string = eval(string);
                input.value = string;
            } catch {
                input.value = "Error";
                string = "";
            }
        } 
        else if (value === "AC") {
            string = "";
            input.value = string;
        } 
        else if (value === "DEL") {
            string = string.slice(0, -1);
            input.value = string;
        } 


        else if (value === "%") {
            try {
                string = (parseFloat(string) / 100).toString();
                input.value = string;
            } catch {
                input.value = "Error";
                string = "";
            }
        }
        else {
            string += value;
            input.value = string;
        }
    });
});
</script>

</body>
</html>
